<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フロリダディズニー機内クイズ</title>
<style>
    /* 全体のデザイン設定 */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif;
        background: linear-gradient(135deg, #005C97 0%, #363795 100%); /* 深いブルー（夜空イメージ） */
        color: #333;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* スクロール防止 */
    }

    /* 共通カードデザイン */
    .card {
        background: #fff;
        width: 90%;
        max-width: 400px;
        height: 85vh; /* 画面の85%の高さ */
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        overflow-y: auto; /* 中身が多い時はスクロール */
        position: relative;
        border: 4px solid #FFD700; /* ゴールド枠 */
    }

    /* 各画面の初期設定（非表示） */
    .screen { display: none; padding: 20px; text-align: center; height: 100%; box-sizing: border-box; }
    .screen.active { display: flex; flex-direction: column; justify-content: center; }

    /* タイトル画面 */
    #start-screen h1 { color: #005C97; font-size: 28px; margin-bottom: 10px; }
    #start-screen p { font-size: 16px; color: #666; }

    /* クイズ画面 */
    .status-bar { 
        display: flex; justify-content: space-between; 
        font-size: 14px; color: #666; margin-bottom: 10px; font-weight: bold;
    }
    .question-box {
        font-size: 20px; font-weight: bold; margin: 20px 0; min-height: 60px;
        display: flex; align-items: center; justify-content: center;
    }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
        background: #f0f4f8; border: 2px solid #d1d9e6;
        padding: 15px; border-radius: 12px; font-size: 18px;
        cursor: pointer; transition: 0.2s; font-weight: bold; color: #005C97;
    }
    .option-btn:active { background: #d1d9e6; transform: scale(0.98); }

    /* 解説画面 */
    #explain-screen { background: #fdfdf0; }
    .result-icon { font-size: 60px; margin-bottom: 10px; display: block; }
    .correct-msg { color: #27ae60; font-size: 24px; font-weight: bold; }
    .wrong-msg { color: #c0392b; font-size: 24px; font-weight: bold; }
    .explain-text { 
        text-align: left; background: #fff; border: 2px dotted #aaa; 
        padding: 15px; border-radius: 10px; margin: 15px 0; font-size: 16px; line-height: 1.6; 
    }
    .next-btn {
        background: #FFD700; color: #333; border: none; padding: 15px 30px;
        font-size: 20px; border-radius: 50px; cursor: pointer; font-weight: bold;
        box-shadow: 0 4px 0 #d4b106; margin-top: auto;
    }
    .next-btn:active { transform: translateY(4px); box-shadow: none; }

    /* 結果画面 */
    #result-screen h2 { font-size: 24px; color: #005C97; }
    .score-big { font-size: 60px; color: #c0392b; font-weight: bold; }

    /* ルビ調整 */
    ruby { font-size: 20px; }
    rt { font-size: 10px; color: #555; }
</style>
</head>
<body>

    <div id="start-screen" class="screen active card">
        <div style="font-size:60px;">🏰✈️</div>
        <h1>フロリダ<br>ディズニー検定</h1>
        <p>機内で予習！<br>全20問の旅へ出発しよう！</p>
        <button class="next-btn" onclick="startGame()">クイズをはじめる</button>
    </div>

    <div id="quiz-screen" class="screen card">
        <div class="status-bar">
            <span>第 <span id="q-num">1</span>/20 問</span>
            <span>スコア: <span id="score">0</span></span>
        </div>
        <div class="question-box" id="question-text">読み込み中...</div>
        <div class="options-grid" id="options-area"></div>
    </div>

    <div id="explain-screen" class="screen card">
        <div id="result-header"></div>
        <div class="explain-text">
            <strong>💡 解説・豆知識</strong><br>
            <span id="explain-content">ここに解説が入ります</span>
        </div>
        <button class="next-btn" onclick="nextQuestion()">つぎへ進む ➡</button>
    </div>

    <div id="result-screen" class="screen card">
        <h2>🎉 結果発表 🎉</h2>
        <p>あなたの知識レベルは...</p>
        <div class="score-big"><span id="final-score">0</span>点</div>
        <p id="final-comment">コメント</p>
        <button class="next-btn" onclick="location.reload()" style="background:#3498db; box-shadow:0 4px 0 #2980b9; color:white;">もう一度あそぶ</button>
    </div>

<script>
