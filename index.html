<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フロリダディズニー機内クイズ</title>
<script>
    // エラー診断
    window.onerror = function(msg, url, line) {
        alert("【エラー発生】\n" + msg + "\n行: " + line);
        return false;
    };
</script>
<style>
    /* 全体デザイン */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: #333;
        margin: 0; padding: 0;
        height: 100vh;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden;
    }
    .card {
        background: #fff;
        width: 90%; max-width: 400px; height: 90vh;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: flex; flex-direction: column;
        overflow-y: auto; position: relative;
        border: 4px solid #FFD700;
    }
    .screen { display: none; padding: 20px; text-align: center; height: 100%; box-sizing: border-box; }
    .screen.active { display: flex; flex-direction: column; justify-content: center; }
    
    input[type="text"] { font-size: 20px; padding: 10px; width: 80%; border: 2px solid #ccc; border-radius: 8px; margin: 20px 0; text-align: center; }
    
    .next-btn { background: #FFD700; color: #333; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #d4b106; margin-top: 10px; width: 100%; }
    .next-btn:active { transform: translateY(4px); box-shadow: none; }
    
    /* 送信ボタン（Google） */
    .send-cloud-btn {
        background: #4285F4; color: white; border: none; padding: 15px 30px;
        font-size: 16px; border-radius: 50px; cursor: pointer; font-weight: bold;
        box-shadow: 0 4px 0 #2a65c7; margin-top: 10px; width: 100%;
        display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .send-cloud-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

    /* クイズ画面 */
    .status-bar { display: flex; justify-content: space-between; font-size: 14px; color: #666; margin-bottom: 10px; font-weight: bold; }
    .question-box { font-size: 18px; font-weight: bold; margin: 10px 0 20px 0; min-height: 50px; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .option-btn { background: #f0f4f8; border: 2px solid #d1d9e6; padding: 12px 5px; border-radius: 12px; font-size: 15px; cursor: pointer; font-weight: bold; color: #005C97; min-height: 60px; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
    .option-btn:active { background: #d1d9e6; }
    .option-btn.disabled { opacity: 0.2; pointer-events: none; }

    .lifeline-area { margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px; }
    .lifeline-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #c0392b; font-size: 14px; }
    .lifeline-btn:disabled { background: #95a5a6; box-shadow: none; cursor: not-allowed; opacity: 0.6; }

    #explain-screen { background: #fdfdf0; }
    .explain-text { text-align: left; background: #fff; border: 2px dotted #aaa; padding: 15px; border-radius: 10px; margin: 15px 0; font-size: 15px; line-height: 1.6; max-height: 40vh; overflow-y: auto; }
    
    .passport-stamp { border: 4px double #c0392b; border-radius: 10px; padding: 20px; margin: 10px 0; transform: rotate(-2deg); background-image: radial-gradient(#fff 20%, #f0f0f0 20%); background-size: 10px 10px; }
    .score-big { font-size: 50px; color: #c0392b; font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>

    <div id="start-screen" class="screen active card">
        <div style="font-size:60px;">🏰✈️</div>
        <h1>フロリダ<br>ディズニー検定</h1>
        <p>名前を入れてスタート！</p>
        <input type="text" id="player-name" placeholder="お名前を入力してね" maxlength="10">
        <button class="next-btn" onclick="startGame()">クイズをはじめる</button>
        <div style="margin-top:20px; font-size:12px; color:#aaa;">Ver.Final (Google Sync)</div>
    </div>

    <div id="quiz-screen" class="screen card">
        <div class="status-bar"><span id="display-name">ゲスト</span><span>第 <span id="q-num">1</span>/20 問</span></div>
        <div class="question-box" id="question-text">読み込み中...</div>
        <div class="options-grid" id="options-area"></div>
        <div class="lifeline-area"><button id="lifeline-btn" class="lifeline-btn" onclick="useLifeline()">🆘 50:50 (残り1回)</button></div>
    </div>

    <div id="explain-screen" class="screen card">
        <div id="result-header" style="font-size:24px; font-weight:bold; margin-bottom:10px;"></div>
        <div class="explain-text"><strong>💡 解説・豆知識</strong><br><span id="explain-content">...</span></div>
        <button class="next-btn" onclick="nextQuestion()">つぎへ進む ➡</button>
    </div>

    <div id="result-screen" class="screen card">
        <h2>🎉 検定結果 🎉</h2>
        <div class="passport-stamp">
            <div style="font-size:14px; color:#555;">CHALLENGER</div>
            <div id="final-name" style="font-size:24px; font-weight:bold; color:#1e3c72;">NAME</div>
            <hr style="border:0; border-top:1px dashed #c0392b; margin:10px 0;">
            <div style="font-size:14px; color:#555;">SCORE</div>
            <div class="score-big"><span id="final-score">0</span>点</div>
            <div style="font-size:12px; color:#aaa;" id="play-date">2025/02/01</div>
        </div>

        <p style="font-size:12px; color:#666;">👇 ネットに繋がったら押してね</p>

        <button id="btn-send-google" class="send-cloud-btn" onclick="sendToGoogle()">
            ☁️ 集計係へ送信
        </button>
        <p id="send-status" style="font-size:12px; height:15px; color:blue; margin-top:5px;"></p>

        <button class="next-btn" onclick="location.reload()" style="background:#3498db; margin-top:30px;">タイトルに戻る</button>
    </div>

<script>
    // ▼▼▼ あなたのフォーム情報（設定済み） ▼▼▼
    
    // 1. 送信先URL (viewform -> formResponseに変換済み)
    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScotdxNOv67fH4eiPm9b3I7BdvfVXd8093G2tVZklNUPmUigw/formResponse";
    
    // 2. 「名前」のID
    const ENTRY_ID_NAME = "entry.564231356"; 

    // 3. 「点数」のID
    const ENTRY_ID_SCORE = "entry.725680528";

    // ▲▲▲ 設定ここまで ▲▲▲


    // クイズデータ
    var quizData = [
        { q: "東京（羽田）からダラス経由でフロリダディズニーがあるオーランドに行きます。飛行機は何時間搭乗するでしょうか？", options: ["約8時間", "約10時間", "約12時間", "約14時間"], a: "約14時間", explain: "羽田ーダラスが11時間30分、ダラスーオランドが2時間30分、合計で約14時間です。乗り継ぎ含めると、約18時間の長旅になります！" },
        { q: "日本とフロリダ（オーランド）の時差は何時間？（2月時点）", options: ["14時間", "8時間", "5時間", "時差はない"], a: "14時間", explain: "日本が14時間進んでいます。日本の昼12時は、フロリダの昨夜22時。時差ボケ対策が重要です！" },
        { q: "今回の旅行から導入された、列に並ばず早く乗れる「予約システム」の新しい名前は？", options: ["ファストパス", "ジーニー・プラス", "ライトニング・レーン", "プレミアム・アクセス"], a: "ライトニング・レーン", explain: "以前の「ジーニー・プラス」が廃止され、「ライトニング・レーン・マルチパス（LLMP）」などの名称に変わりました。" },
        { q: "【子供優遇】身長制限などで子供が乗れない時、1回分の待ち時間で親が交代して乗れる仕組みは？", options: ["ライダー・スイッチ", "チャイルド・パス", "ペア・チェンジ", "ファミリー・スワップ"], a: "ライダー・スイッチ", explain: "「ライダー・スイッチ（Rider Switch）」です。列に並ぶ前にキャストに言えば設定してくれます。パパとママが交代で楽しめます！" },
        { q: "【2/20 アニマルキングダム】映画『アバター』のエリアで乗ることができる、空を飛ぶ生き物の名前は？", options: ["ドラゴン", "バンシー", "プテラノドン", "ペガサス"], a: "バンシー", explain: "正式名称はイクランですが、ナヴィ族の言葉でバンシーとも呼ばれます。「フライト・オブ・パッセージ」は超人気なので朝一かLLシングルパス推奨！" },
        { q: "【2/20 アニマルキングダム】本物の動物が見られる「キリマンジャロ・サファリ」。動物が活発に動いていて狙い目な時間は？", options: ["朝一番", "お昼ごはん時", "15時のおやつ時", "夜"], a: "朝一番", explain: "動物たちは涼しい朝の方が活発です。パークに入ったら早めに行くのがセオリー！" },
        { q: "【2/21 ハリウッドスタジオ】『スター・ウォーズ』のエリアで飲める、映画にも出た不思議な飲み物の色は？", options: ["赤と黒", "青と緑", "金と銀", "紫と黄"], a: "青と緑", explain: "「ブルーミルク」と「グリーンミルク」が売っています。味は...飲んでみてのお楽しみ！" },
        { q: "【2/21 ハリウッドスタジオ】夜のショー「ファンタズミック！」は、ミッキーが何の戦うショー？", options: ["ドラゴン", "海賊", "宇宙人", "恐竜"], a: "ドラゴン", explain: "ミッキーの夢の中で、マレフィセントが変身した巨大ドラゴンと戦います。東京と違って専用の野外劇場で見ます！" },
        { q: "【2/21 ハリウッドスタジオ】映画『トイ・ストーリー』に出てくる、犬のバネのおもちゃのコースターの名前は？", options: ["スリンキー・ドッグ・ダッシュ", "ウッディのラウンドアップ", "レックスのスピナー", "バズのスペース・レンジャー"], a: "スリンキー・ドッグ・ダッシュ", explain: "「スリンキー・ドッグ・ダッシュ」です。親子で乗れる適度なスリルが大人気！待ち時間が長いので朝一かLL推奨です。" },
        { q: "【2/22 エプコット】最新コースター『ガーディアンズ・オブ・ギャラクシー』の最大の特徴は？", options: ["水に濡れる", "後ろ向きに発射", "3Dメガネをかける", "宙返りする"], a: "後ろ向きに発射", explain: "世界最大級の屋内コースターです。予測不能な動きとノリノリの音楽で最高に盛り上がります！（酔い止め推奨）" },
        { q: "【2/22 エプコット】映画『アナと雪の女王』のアトラクションがあるのは、どこの国の館？", options: ["アメリカ館", "日本館", "ノルウェー館", "フランス館"], a: "ノルウェー館", explain: "ノルウェー館にあります。大人気なので、ここもライトニング・レーン（マルチパス）で狙いたい場所です！" },
        { q: "【2/22 エプコット】日本館にある百貨店「三越」。ここで外国人に大人気の体験は何？", options: ["真珠の取り出し", "寿司にぎり体験", "着付け体験", "忍者修行"], a: "真珠の取り出し", explain: "「アコヤ・パール」の取り出し体験が大人気！どんな真珠が出るかはお楽しみ。" },
        { q: "【2/23 マジックキングダム】最新アトラクション『トロン・ライトサイクル・ラン』の乗り方は？", options: ["普通に座る", "立って乗る", "バイクのように跨る", "寝転がる"], a: "バイクのように跨る", explain: "前傾姿勢でバイクにまたがって爆走します！スタートの加速が凄まじい爽快アトラクションです。" },
        { q: "【2/23 マジックキングダム】夜のショー「ハッピリー・エバー・アフター」。お城の上空を飛ぶキャラクターは？", options: ["ピーターパン", "アラジン", "ティンカーベル", "ダンボ"], a: "ティンカーベル", explain: "ショーのクライマックスで、本当にティンカーベルが夜空を飛びます。感動間違いなし！" },
        { q: "【2/23 マジックキングダム】2024年オープン！『スプラッシュ・マウンテン』が生まれ変わった最新アトラクションは？", options: ["ティアナのバイユー・アドベンチャー", "モアナの水の旅", "ラプンツェルのランタン", "フローズン・エバー・アフター"], a: "ティアナのバイユー・アドベンチャー", explain: "映画『プリンセスと魔法のキス』がテーマの最新ライド！びしょ濡れになりますが、音楽が最高に楽しいです！" },
        { q: "【食事】レストランで並ばずに注文できる、便利なスマホ機能の名前は？", options: ["モバイルオーダー", "クイックオーダー", "スピードイート", "ファストフード"], a: "モバイルオーダー", explain: "アプリから事前に注文・決済できます。お腹が空く前に注文しておくのがコツ！" },
        { q: "【Tips】朝の開園よりも早く到着し、開いた瞬間に人気アトラクションへ向かう作戦を通称なんと言う？", options: ["ロープ・ドロップ", "モーニング・ダッシュ", "アーリー・エントリー", "スター・スタート"], a: "ロープ・ドロップ", explain: "開園待ちのロープが下ろされることからこう呼ばれます。朝一の30分が勝負！早起きは三文の徳です。" },
        { q: "【飲み物】フロリダは暑いです。クイックサービスのレストランで「無料」でもらえるものは？", options: ["コーラ", "氷水（カップ）", "オレンジジュース", "炭酸水"], a: "氷水（カップ）", explain: "「カップ・オブ・ウォーター、プリーズ」と言えば、無料で氷水がもらえます。水分補給はこまめに！" },
        { q: "【お土産】パークで初めて来た人がもらえる、無料のプレゼントは？", options: ["カチューシャ", "ポップコーン", "缶バッジ", "ステッカー"], a: "缶バッジ", explain: "「1st Visit」の缶バッジが無料でもらえます。キャストやゲストリレーションで貰って、服につけよう！" },
        { q: "今回のフロリダ旅行、一番楽しむべきなのは？", options: ["じーじ", "ばーば", "とも", "全員！"], a: "全員！", explain: "じーじも、ばーばも、ともくんも、全員で協力して、最高の思い出を作りましょう！Have a Magical Day!" }
    ];

    var currentQIndex = 0;
    var score = 0;
    var lifelineUsed = false;
    var playerName = "";

    function showScreen(screenId) {
        var screens = document.querySelectorAll('.screen');
        for (var i = 0; i < screens.length; i++) {
            screens[i].classList.remove('active');
        }
        document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
        var inputName = document.getElementById('player-name').value;
        if(inputName.trim() === "") { alert("お名前を入力してください！"); return; }
        playerName = inputName;
        document.getElementById('display-name').innerText = "挑戦者: " + playerName;
        currentQIndex = 0; score = 0; lifelineUsed = false;
        var btn = document.getElementById('lifeline-btn');
        btn.disabled = false; btn.innerText = "🆘 50:50 (残り1回)";
        showScreen('quiz-screen'); loadQuestion();
    }

    function loadQuestion() {
        var data = quizData[currentQIndex];
        document.getElementById('q-num').innerText = currentQIndex + 1;
        document.getElementById('question-text').innerHTML = data.q;
        var optionsDiv = document.getElementById('options-area');
        optionsDiv.innerHTML = '';
        for (var i = 0; i < data.options.length; i++) {
            var btn = document.createElement('button');
            btn.className = 'option-btn'; btn.innerText = data.options[i];
            btn.id = "btn-" + i; btn.dataset.isCorrect = (data.options[i] === data.a) ? "true" : "false";
            (function(opt, answer, explanation) {
                btn.onclick = function() { checkAnswer(opt, answer, explanation); };
            })(data.options[i], data.a, data.explain);
            optionsDiv.appendChild(btn);
        }
    }

    function useLifeline() {
        if (lifelineUsed) return; 
        var buttons = document.querySelectorAll('.option-btn');
        var wrongButtons = [];
        for (var i = 0; i < buttons.length; i++) { if (buttons[i].dataset.isCorrect === "false") wrongButtons.push(buttons[i]); }
        wrongButtons.sort(function() { return 0.5 - Math.random(); });
        if (wrongButtons.length >= 2) { wrongButtons[0].classList.add('disabled'); wrongButtons[1].classList.add('disabled'); }
        lifelineUsed = true;
        var btn = document.getElementById('lifeline-btn'); btn.disabled = true; btn.innerText = "50:50 (使用済み)";
    }

    function checkAnswer(selected, correct, explanation) {
        var header = document.getElementById('result-header');
        var explainContent = document.getElementById('explain-content');
        if(selected === correct) { score++; header.innerHTML = '<span style="color:#27ae60">⭕️ 正解！</span>'; }
        else { header.innerHTML = '<span style="color:#c0392b">❌ ざんねん...</span><br><span style="font-size:16px">正解は「' + correct + '」</span>'; }
        explainContent.innerHTML = explanation;
        showScreen('explain-screen');
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex < quizData.length) { showScreen('quiz-screen'); loadQuestion(); }
        else { showResult(); }
    }

    function showResult() {
        showScreen('result-screen');
        var finalScore = score * 5;
        document.getElementById('final-name').innerText = playerName;
        document.getElementById('final-score').innerText = finalScore;
        var d = new Date();
        var dateStr = d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " + d.getHours() + ":" + ("0"+d.getMinutes()).slice(-2);
        document.getElementById('play-date').innerText = dateStr;
    }

    // ▼▼▼ Googleフォームへ送信（設定済み） ▼▼▼
    function sendToGoogle() {
        var btn = document.getElementById('btn-send-google');
        var status = document.getElementById('send-status');
        btn.disabled = true;
        btn.innerText = "送信中...";
        status.innerText = "";

        var finalScore = score * 5;
        
        var formData = new FormData();
        formData.append(ENTRY_ID_NAME, playerName);
        formData.append(ENTRY_ID_SCORE, finalScore);

        // Fetch (no-corsモード)
        fetch(GOOGLE_FORM_URL, {
            method: "POST",
            mode: "no-cors", // Googleフォームへの送信には必須
            body: formData
        }).then(function() {
            btn.innerText = "送信完了！";
            btn.style.background = "#2ecc71";
            status.innerText = "集計係にデータが届きました！";
            alert("送信しました！スプレッドシートを確認してください。");
        }).catch(function(err) {
            btn.disabled = false;
            btn.innerText = "再試行する";
            status.innerText = "エラー: ネットを確認してください";
            alert("送信に失敗しました。\n・機内モードになっていませんか？\n・Wi-Fiに繋がっていますか？");
        });
    }
</script>
</body>
</html>
